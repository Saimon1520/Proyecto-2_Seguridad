version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: login_db
    environment:
      POSTGRES_DB: login_secure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: login_app
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/login_secure
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Define NEXTAUTH_SECRET en .env (openssl rand -base64 32)}
      NEXTAUTH_URL: http://localhost:3001
      NODE_ENV: development
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ./start.sh

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge 